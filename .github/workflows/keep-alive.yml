name: Keep API awake

# Evita o cold start do Render (plano free) batendo em /health a cada 10 min.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /health
        run: |
          curl -sf --max-time 100 --retry 2 --retry-delay 10 --retry-all-errors \
            "${{ vars.API_URL || 'https://sinaliza-api-2ey0.onrender.com' }}/health"
