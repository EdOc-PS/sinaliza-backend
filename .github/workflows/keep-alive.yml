name: Keep API awake

# O Render (plano free) suspende a instância depois de ~15 min sem receber
# requisições, e a primeira requisição depois disso demora dezenas de
# segundos para responder. Este workflow bate em /health a cada 10 minutos
# para a instância nunca chegar a dormir — evita o cold start em vez de só
# tolerá-lo (o frontend também tem retentativa silenciosa como segunda linha
# de defesa, para quando isto aqui falhar ou a instância reiniciar por deploy).
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /health
        run: curl -sf --max-time 55 "${{ vars.API_URL || 'https://sinaliza-api-2ey0.onrender.com' }}/health"
